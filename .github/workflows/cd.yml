name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key ubuntu@"$DEPLOY_HOST" 'sudo mkdir -p /opt/johnny-blog && sudo chown ubuntu:ubuntu /opt/johnny-blog'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.turbo/' \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'cookies.txt' \
            --exclude 'johnny.pem' \
            ./ ubuntu@"$DEPLOY_HOST":/opt/johnny-blog/

          ssh -i ~/.ssh/deploy_key ubuntu@"$DEPLOY_HOST" <<'EOF'
            set -euo pipefail

            cd /opt/johnny-blog
            sudo rm -rf cookies.txt
            docker compose up -d --build --remove-orphans
            docker image prune -f
          EOF
